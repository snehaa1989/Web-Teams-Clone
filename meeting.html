<!DOCTYPE html>
<html>
    <head>
        <title>Zenference - Meeting Room</title>
        <meta content="width=device-width, initial-scale=1" name="viewport" />
        
        <!-- Bootstrap CSS -->
        <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css">
        <!-- Font Awesome -->
        <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.7.2/css/all.css">
        <!-- Custom CSS -->
        <link rel='stylesheet' href='css/style.css' type="text/css">
        <link rel='stylesheet' href='css/translator.css' type="text/css">
        <link rel='stylesheet' href='css/beRightBack.css' type="text/css">
        
        <style>
            .meeting-container {
                height: 100vh;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                overflow: hidden;
            }
            
            .video-grid {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
                gap: 10px;
                padding: 20px;
                height: calc(100vh - 80px);
                overflow-y: auto;
            }
            
            .video-wrapper {
                position: relative;
                background: #000;
                border-radius: 8px;
                overflow: hidden;
                aspect-ratio: 16/9;
            }
            
            .video-element {
                width: 100%;
                height: 100%;
                object-fit: cover;
            }
            
            .participant-info {
                position: absolute;
                bottom: 10px;
                left: 10px;
                background: rgba(0,0,0,0.7);
                color: white;
                padding: 5px 10px;
                border-radius: 5px;
                font-size: 12px;
            }
            
            .control-bar {
                position: fixed;
                bottom: 0;
                left: 0;
                right: 0;
                background: rgba(0,0,0,0.8);
                backdrop-filter: blur(10px);
                padding: 15px;
                display: flex;
                justify-content: center;
                align-items: center;
                gap: 15px;
                z-index: 1000;
            }
            
            .control-btn {
                background: rgba(255,255,255,0.1);
                border: 1px solid rgba(255,255,255,0.2);
                color: white;
                width: 50px;
                height: 50px;
                border-radius: 50%;
                display: flex;
                align-items: center;
                justify-content: center;
                cursor: pointer;
                transition: all 0.3s ease;
            }
            
            .control-btn:hover {
                background: rgba(255,255,255,0.2);
                transform: scale(1.1);
            }
            
            .control-btn.active {
                background: #28a745;
                border-color: #28a745;
            }
            
            .control-btn.danger {
                background: #dc3545;
                border-color: #dc3545;
            }
            
            .side-panel {
                position: fixed;
                right: 150px;
                bottom: 80px;
                width: 320px;
                height: 400px;
                background: rgba(0,0,0,0.95);
                backdrop-filter: blur(10px);
                border-radius: 20px;
                transition: all 0.3s ease;
                z-index: 999;
                overflow: hidden;
                transform: scale(0) translateY(20px);
                opacity: 0;
                pointer-events: none;
                box-shadow: 0 10px 40px rgba(0,0,0,0.3);
                border: 1px solid rgba(255,255,255,0.1);
            }
            
            .side-panel::before {
                content: '';
                position: absolute;
                bottom: -8px;
                right: 30px;
                width: 0;
                height: 0;
                border-left: 8px solid transparent;
                border-right: 8px solid transparent;
                border-top: 8px solid rgba(0,0,0,0.95);
                filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
            }
            
            .side-panel.open {
                transform: scale(1) translateY(0);
                opacity: 1;
                pointer-events: all;
            }
            
            .panel-header {
                background: rgba(255,255,255,0.15);
                padding: 12px 15px;
                border-bottom: 1px solid rgba(255,255,255,0.2);
                display: flex;
                justify-content: space-between;
                align-items: center;
                border-top-left-radius: 20px;
                border-top-right-radius: 20px;
            }
            
            .panel-content {
                padding: 15px;
                display: flex;
                flex-direction: column;
                height: calc(100% - 60px);
            }
            
            .chat-messages {
                max-height: 250px;
                overflow-y: auto;
                margin-bottom: 12px;
                padding: 8px;
                background: rgba(255,255,255,0.05);
                border-radius: 12px;
            }
            
            .chat-message {
                background: rgba(255,255,255,0.08);
                border-radius: 12px;
                padding: 8px 12px;
                margin-bottom: 8px;
                border: 1px solid rgba(255,255,255,0.1);
            }
            
            .chat-message.own {
                background: rgba(40, 167, 69, 0.2);
                margin-left: 20px;
            }
            
            .participant-list {
                list-style: none;
                padding: 0;
            }
            
            .participant-item {
                background: rgba(255,255,255,0.1);
                border-radius: 8px;
                padding: 10px;
                margin-bottom: 8px;
                display: flex;
                justify-content: space-between;
                align-items: center;
            }
            
            .recording-indicator {
                position: fixed;
                top: 20px;
                right: 20px;
                background: #dc3545;
                color: white;
                padding: 8px 15px;
                border-radius: 20px;
                display: flex;
                align-items: center;
                gap: 8px;
                animation: pulse 2s infinite;
            }
            
            @keyframes pulse {
                0% { opacity: 1; }
                50% { opacity: 0.7; }
                100% { opacity: 1; }
            }
            
            .settings-modal {
                position: fixed;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                background: rgba(0,0,0,0.9);
                backdrop-filter: blur(10px);
                border-radius: 15px;
                padding: 30px;
                z-index: 1001;
                display: none;
            }
            
            .settings-modal.show {
                display: block;
            }
            
            /* Media Sharing Styles */
            .media-preview-container {
                background: rgba(255,255,255,0.1);
                border-radius: 10px;
                margin-bottom: 15px;
                overflow: hidden;
            }
            
            .preview-header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 10px 15px;
                background: rgba(255,255,255,0.05);
                border-bottom: 1px solid rgba(255,255,255,0.1);
                color: white;
                font-size: 14px;
            }
            
            .preview-content {
                padding: 15px;
                max-height: 200px;
                overflow: auto;
            }
            
            .preview-content img {
                max-width: 100%;
                max-height: 150px;
                border-radius: 8px;
                display: block;
                margin: 0 auto;
            }
            
            .preview-content video {
                max-width: 100%;
                max-height: 150px;
                border-radius: 8px;
                display: block;
                margin: 0 auto;
            }
            
            .preview-content audio {
                width: 100%;
                margin: 10px 0;
            }
            
            .file-info {
                background: rgba(255,255,255,0.05);
                border-radius: 8px;
                padding: 10px;
                color: white;
                text-align: center;
                font-size: 14px;
            }
            
            .file-info .file-name {
                font-weight: 600;
                margin-bottom: 5px;
                word-break: break-all;
            }
            
            .file-info .file-size {
                color: rgba(255,255,255,0.7);
                font-size: 12px;
            }
            
            .chat-input-container {
                margin-top: auto;
            }
            
            .chat-input-container .input-group {
                background: rgba(255,255,255,0.1);
                border-radius: 25px;
                overflow: hidden;
                border: 1px solid rgba(255,255,255,0.2);
            }
            
            .chat-input-container .form-control {
                background: transparent;
                border: none;
                color: white;
                padding: 10px 15px;
                font-size: 14px;
            }
            
            .chat-input-container .form-control::placeholder {
                color: rgba(255,255,255,0.6);
            }
            
            .chat-input-container .form-control:focus {
                outline: none;
                box-shadow: none;
                background: transparent;
            }
            
            .chat-input-container .input-group-prepend,
            .chat-input-container .input-group-append {
                background: transparent;
            }
            
            .chat-input-container .btn {
                background: transparent;
                border: none;
                color: rgba(255,255,255,0.8);
                padding: 8px 12px;
                transition: all 0.2s ease;
            }
            
            .chat-input-container .btn:hover {
                color: white;
                background: rgba(255,255,255,0.1);
            }
            
            .chat-input-container .btn-primary {
                background: linear-gradient(135deg, var(--sea-blue) 0%, var(--sea-green) 50%, var(--light-pink) 100%);
                border: none;
                color: white;
                border-radius: 0 25px 25px 0;
            }
            
            .media-message {
                background: rgba(255,255,255,0.1);
                border-radius: 10px;
                padding: 10px;
                margin-bottom: 10px;
                max-width: 80%;
            }
            
            .media-message.own {
                background: rgba(40, 167, 69, 0.2);
                margin-left: auto;
            }
            
            .media-message.other {
                background: rgba(255,255,255,0.1);
                margin-right: auto;
            }
            
            .media-content {
                margin-top: 8px;
            }
            
            .media-content img {
                max-width: 200px;
                max-height: 150px;
                border-radius: 8px;
                cursor: pointer;
                transition: transform 0.2s ease;
            }
            
            .media-content img:hover {
                transform: scale(1.05);
            }
            
            .media-content video {
                max-width: 200px;
                max-height: 150px;
                border-radius: 8px;
            }
            
            .media-content audio {
                width: 100%;
                max-width: 200px;
            }
            
            .media-file-link {
                display: inline-flex;
                align-items: center;
                gap: 8px;
                background: rgba(255,255,255,0.1);
                padding: 8px 12px;
                border-radius: 6px;
                color: white;
                text-decoration: none;
                font-size: 14px;
                transition: background 0.2s ease;
            }
            
            .media-file-link:hover {
                background: rgba(255,255,255,0.2);
                color: white;
                text-decoration: none;
            }
            
            .floating-chat-btn {
                position: fixed !important;
                bottom: 20px !important;
                right: 150px !important;
                width: 45px !important;
                height: 45px !important;
                border-radius: 50% !important;
                background: linear-gradient(135deg, var(--sea-blue) 0%, var(--sea-green) 50%, var(--light-pink) 100%) !important;
                border: 2px solid rgba(255,255,255,0.2) !important;
                color: white !important;
                font-size: 18px !important;
                cursor: pointer !important;
                box-shadow: 0 8px 32px rgba(0,0,0,0.3) !important;
                transition: all 0.3s ease !important;
                z-index: 9999 !important;
                display: flex !important;
                align-items: center !important;
                justify-content: center !important;
            }
            
            .floating-chat-btn:hover {
                transform: scale(1.1);
                box-shadow: 0 6px 25px rgba(0,0,0,0.4);
            }
            
            .chat-badge {
                position: absolute;
                top: -5px;
                right: -5px;
                background: #dc3545;
                color: white;
                border-radius: 50%;
                width: 20px;
                height: 20px;
                font-size: 12px;
                display: flex;
                align-items: center;
                justify-content: center;
                font-weight: bold;
            }
        </style>
    </head>
    
    <body>
        <div class="meeting-container">
            <!-- Video Grid -->
            <div id="video-grid" class="video-grid">
                <!-- Local Video -->
                <div class="video-wrapper">
                    <video id="local" class="video-element" autoplay muted playsinline></video>
                    <div class="participant-info">
                        <span id="local-name">You</span>
                    </div>
                </div>
                
                <!-- Remote Videos Container -->
                <div id="remote-videos"></div>
            </div>
            
            <!-- Control Bar -->
            <div class="control-bar">
                <button id="mic-btn" class="control-btn" title="Toggle Microphone">
                    <i class="fas fa-microphone"></i>
                </button>
                
                <button id="video-btn" class="control-btn" title="Toggle Video">
                    <i class="fas fa-video"></i>
                </button>
                
                <button id="screen-btn" class="control-btn" title="Share Screen">
                    <i class="fas fa-desktop"></i>
                </button>
                
                <button id="record-btn" class="control-btn" title="Start Recording">
                    <i class="fas fa-circle"></i>
                </button>
                
                <button id="participants-btn" class="control-btn" title="Participants">
                    <i class="fas fa-users"></i>
                </button>
                
                <button id="settings-btn" class="control-btn" title="Settings">
                    <i class="fas fa-cog"></i>
                </button>
                
                <button id="proximity-btn" class="control-btn" title="Toggle Proximity Detection" onclick="toggleProximityDetection()">
                    <i class="fas fa-user-check"></i>
                </button>
                
                <button id="translate-btn" class="control-btn" title="Toggle Translation" onclick="toggleTranslation()">
                    <i class="fas fa-language"></i>
                </button>
                
                <button id="leave-btn" class="control-btn danger" title="Leave Meeting">
                    <i class="fas fa-phone-slash"></i>
                </button>
            </div>
            
            <!-- Recording Indicator -->
            <div id="recording-indicator" class="recording-indicator" style="display: none;">
                <i class="fas fa-circle"></i>
                <span>Recording</span>
            </div>
            
            <!-- Chat Panel -->
            <div id="chat-panel" class="side-panel">
                <div class="panel-header">
                    <h5>Chat</h5>
                    <button id="close-chat" class="btn btn-sm btn-outline-light">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
                <div class="panel-content">
                    <div id="chat-messages" class="chat-messages"></div>
                    
                    <!-- Media Preview Container -->
                    <div id="media-preview" class="media-preview-container" style="display: none;">
                        <div class="preview-header">
                            <span>Media Preview</span>
                            <button id="remove-media" class="btn btn-sm btn-outline-light">
                                <i class="fas fa-times"></i>
                            </button>
                        </div>
                        <div id="preview-content" class="preview-content"></div>
                    </div>
                    
                    <div class="chat-input-container">
                        <div class="input-group">
                            <div class="input-group-prepend">
                                <button id="media-btn" class="btn btn-outline-light" title="Share Media">
                                    <i class="fas fa-paperclip"></i>
                                </button>
                                <input type="file" id="media-input" accept="image/*,video/*,audio/*,.pdf,.doc,.docx,.txt" style="display: none;">
                            </div>
                            <input type="text" id="chat-input" class="form-control" placeholder="Type a message...">
                            <div class="input-group-append">
                                <button id="send-chat" class="btn btn-primary">
                                    <i class="fas fa-paper-plane"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Participants Panel -->
            <div id="participants-panel" class="side-panel">
                <div class="panel-header">
                    <h5>Participants</h5>
                    <button id="close-participants" class="btn btn-sm btn-outline-light">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
                <div class="panel-content">
                    <ul id="participants-list" class="participant-list"></ul>
                </div>
            </div>
            
            <!-- Settings Modal -->
            <div id="settings-modal" class="settings-modal">
                <h4>Meeting Settings</h4>
                <div class="form-group">
                    <label>Video Quality</label>
                    <select id="video-quality" class="form-control">
                        <option value="auto">Auto</option>
                        <option value="720p">720p HD</option>
                        <option value="1080p">1080p Full HD</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Audio Input</label>
                    <select id="audio-input" class="form-control"></select>
                </div>
                <div class="form-group">
                    <label>Video Input</label>
                    <select id="video-input" class="form-control"></select>
                </div>
        </div>
        
        <!-- Recording Indicator -->
        <div id="recording-indicator" class="recording-indicator" style="display: none;">
            <i class="fas fa-circle"></i>
            <span>Recording</span>
        </div>
        
        <script>
            // Parse JWT token function
            function parseJWT(token) {
                try {
                    console.log('Parsing JWT token:', token.substring(0, 50) + '...');
                    
                    const base64Url = token.split('.')[1];
                    if (!base64Url) {
                        console.error('Invalid JWT format - no payload found');
                        return null;
                    }
                    
                    const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
                    const jsonPayload = decodeURIComponent(
                        atob(base64)
                            .split('')
                            .map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2))
                            .join('')
                    );
                    
                    const parsed = JSON.parse(jsonPayload);
                    console.log('JWT parsed successfully:', parsed);
                    
                    // Check for different possible user structures
                    if (parsed.user) {
                        return parsed;
                    } else if (parsed.userId || parsed.username || parsed.email) {
                        // If user data is directly in the payload
                        return { user: parsed };
                    } else {
                        console.error('No user data found in JWT payload');
                        return null;
                    }
                } catch (error) {
                    console.error('Error parsing JWT:', error);
                    return null;
                }
            }
            
            // Meeting room logic
            let videoConference = null;
            let currentRoom = null;
            let currentUser = null;
            let selectedMediaFile = null;
            let mediaPreviewUrl = null;
            
            // Initialize meeting
            document.addEventListener('DOMContentLoaded', async () => {
                try {
                    // Get room info from URL
                    const urlParams = new URLSearchParams(window.location.search);
                    const roomId = urlParams.get('room');
                    
                    // Get token from authSession (new method)
                    const sessionData = localStorage.getItem('authSession');
                    let token = null;
                    
                    if (sessionData) {
                        try {
                            const parsed = JSON.parse(sessionData);
                            token = parsed.token;
                        } catch (error) {
                            console.error('Error parsing session data:', error);
                        }
                    }
                    
                    // Fallback to old method
                    if (!token) {
                        token = localStorage.getItem('token');
                    }
                    
                    if (!token) {
                        console.error('No authentication token found');
                        alert('Please login first');
                        window.location.href = '/index.html';
                        return;
                    }
                    
                    // Parse JWT token
                    const parsed = parseJWT(token);
                    if (!parsed || !parsed.user) {
                        console.error('Invalid token');
                        alert('Invalid authentication token');
                        window.location.href = '/index.html';
                        return;
                    }
                    
                    // Create user object - prioritize authSession data if available
                    if (sessionData) {
                        try {
                            const sessionParsed = JSON.parse(sessionData);
                            currentUser = {
                                id: sessionParsed.user._id || sessionParsed.user.id,
                                username: sessionParsed.user.username,
                                email: sessionParsed.user.email,
                                avatar: sessionParsed.user.avatar
                            };
                            console.log('Using user data from authSession:', currentUser);
                        } catch (error) {
                            console.error('Error using authSession, falling back to JWT:', error);
                            currentUser = {
                                id: parsed.user.userId || parsed.user._id,
                                username: parsed.user.username || `User ${parsed.user.userId}`,
                                email: parsed.user.email,
                            };
                        }
                    } else {
                        currentUser = {
                            id: parsed.user.userId || parsed.user._id,
                            username: parsed.user.username || `User ${parsed.user.userId}`,
                            email: parsed.user.email,
                        };
                    }
                    
                    currentRoom = roomId;
                    
                    console.log('User authenticated:', currentUser.username);
                    console.log('User ID:', currentUser._id || currentUser.id);
                    console.log('Room ID:', roomId);
                    
                    // Initialize video conference
                    console.log('=== ABOUT TO INITIALIZE VIDEO CONFERENCE ===');
                    
                    // Check if VideoConferenceManager is available
                    if (typeof VideoConferenceManager === 'undefined') {
                        console.error('VideoConferenceManager class is not loaded!');
                        throw new Error('VideoConferenceManager class is not loaded');
                    }
                    
                    console.log('VideoConferenceManager class is available');
                    
                    try {
                        videoConference = new VideoConferenceManager();
                        console.log('VideoConferenceManager created:', videoConference);
                        
                        console.log('=== CALLING VIDEO CONFERENCE INITIALIZE ===');
                        await videoConference.initialize(roomId, currentUser._id || currentUser.id);
                        console.log('=== VIDEO CONFERENCE INITIALIZE RETURNED SUCCESSFULLY ===');
                    } catch (error) {
                        console.error('=== VIDEO CONFERENCE CREATION OR INITIALIZE FAILED ===');
                        console.error('Error details:', error);
                        console.error('Error message:', error.message);
                        console.error('Error stack:', error.stack);
                        throw error;
                    }
                    
                    // Setup UI handlers
                    console.log('=== SETTING UP UI HANDLERS ===');
                    
                    // Wait for DOM to be ready before setting up UI handlers
                    if (document.readyState === 'loading') {
                        await new Promise(resolve => {
                            document.addEventListener('DOMContentLoaded', resolve);
                        });
                    }
                    
                    try {
                        setupUIHandlers();
                        console.log('=== UI HANDLERS SETUP SUCCESSFULLY ===');
                    } catch (error) {
                        console.error('=== UI HANDLERS SETUP FAILED ===');
                        console.error('Error:', error);
                        console.error('Error message:', error.message);
                        console.error('Error stack:', error.stack);
                        throw error;
                    }
                    
                    // Handle socket events AFTER initialization
                    // Wait a moment for socket to be fully connected
                    console.log('=== WAITING FOR SOCKET TO BE READY ===');
                    setTimeout(() => {
                        console.log('=== CHECKING SOCKET AVAILABILITY ===');
                        if (videoConference && videoConference.socket) {
                            console.log('Socket is available, setting up event handlers...');
                            try {
                                videoConference.socket.on('chat-message', addChatMessage);
                                
                                videoConference.socket.on('recording-started', (data) => {
                                    document.getElementById('recording-indicator').style.display = 'flex';
                                    document.getElementById('record-btn').classList.add('active');
                                });
                                
                                videoConference.socket.on('recording-stopped', () => {
                                    document.getElementById('recording-indicator').style.display = 'none';
                                    document.getElementById('record-btn').classList.remove('active');
                                });
                                
                                videoConference.socket.on('user-joined', (data) => {
                                    console.log('User joined event received:', data);
                                    if (videoConference.handleUserJoined) {
                                        videoConference.handleUserJoined(data);
                                    }
                                });
                                
                                videoConference.socket.on('user-left', (data) => {
                                    console.log('User left event received:', data);
                                    if (videoConference.handleUserLeft) {
                                        videoConference.handleUserLeft(data);
                                    }
                                });
                                
                                videoConference.socket.on('offer', (data) => {
                                    console.log('Offer received:', data);
                                    if (videoConference.handleOffer) {
                                        videoConference.handleOffer(data);
                                    }
                                });
                                
                                videoConference.socket.on('answer', (data) => {
                                    console.log('Answer received:', data);
                                    if (videoConference.handleAnswer) {
                                        videoConference.handleAnswer(data);
                                    }
                                });
                                
                                videoConference.socket.on('ice-candidate', (data) => {
                                    console.log('ICE candidate received:', data);
                                    if (videoConference.handleIceCandidate) {
                                        videoConference.handleIceCandidate(data);
                                    }
                                });
                                
                                // Join the room after setting up event handlers
                                console.log('Joining room:', roomId);
                                if (videoConference.joinRoom && !videoConference.roomId) {
                                    videoConference.joinRoom(roomId);
                                } else if (videoConference.roomId) {

                function togglePanel(panelId) {
                    const panel = document.getElementById(panelId);
                    panel.classList.toggle('open');
                    
                    // Close other panels
                    const otherPanels = ['chat-panel', 'participants-panel'].filter(id => id !== panelId);
                    otherPanels.forEach(id => {
                        document.getElementById(id).classList.remove('open');
                    });
                }
                
                function closePanel(panelId) {
                    document.getElementById(panelId).classList.remove('open');
                }
                
                function sendChatMessage(message, mediaFile = null) {
                    if (videoConference && videoConference.socket) {
                        const messageData = {
                            message: message || '',
                            type: mediaFile ? 'media' : 'text'
                        };
                        
                        if (mediaFile) {
                            uploadAndSendMedia(mediaFile, messageData);
                        } else {
                            videoConference.socket.emit('chat-message', messageData);
                        }
                    }
                }
                
                function handleMediaSelection(event) {
                    const file = event.target.files[0];
                    if (file) {
                        // Check file size (max 10MB)
                        if (file.size > 10 * 1024 * 1024) {
                            alert('File size must be less than 10MB');
                            event.target.value = '';
                            return;
                        }
                        
                        selectedMediaFile = file;
                        showMediaPreview(file);
                    }
                }
                
                function showMediaPreview(file) {
                    const previewContainer = document.getElementById('media-preview');
                    const previewContent = document.getElementById('preview-content');
                    
                    // Clean up previous preview URL
                    if (mediaPreviewUrl) {
                        URL.revokeObjectURL(mediaPreviewUrl);
                    }
                    
                    previewContent.innerHTML = '';
                    
                    if (file.type.startsWith('image/')) {
                        mediaPreviewUrl = URL.createObjectURL(file);
                        const img = document.createElement('img');
                        img.src = mediaPreviewUrl;
                        previewContent.appendChild(img);
                    } else if (file.type.startsWith('video/')) {
                        mediaPreviewUrl = URL.createObjectURL(file);
                        const video = document.createElement('video');
                        video.src = mediaPreviewUrl;
                        video.controls = true;
                        previewContent.appendChild(video);
                    } else if (file.type.startsWith('audio/')) {
                        mediaPreviewUrl = URL.createObjectURL(file);
                        const audio = document.createElement('audio');
                        audio.src = mediaPreviewUrl;
                        audio.controls = true;
                        previewContent.appendChild(audio);
                    } else {
                        // For documents and other files
                        const fileInfo = document.createElement('div');
                        fileInfo.className = 'file-info';
                        fileInfo.innerHTML = `
                            <div class="file-name">${file.name}</div>
                            <div class="file-size">${formatFileSize(file.size)}</div>
                        `;
                        previewContent.appendChild(fileInfo);
                    }
                    
                    previewContainer.style.display = 'block';
                }
                
                function clearMediaPreview() {
                    const previewContainer = document.getElementById('media-preview');
                    const previewContent = document.getElementById('preview-content');
                    const mediaInput = document.getElementById('media-input');
                    
                    // Clean up preview URL
                    if (mediaPreviewUrl) {
                        URL.revokeObjectURL(mediaPreviewUrl);
                        mediaPreviewUrl = null;
                    }
                    
                    previewContent.innerHTML = '';
                    previewContainer.style.display = 'none';
                    mediaInput.value = '';
                    selectedMediaFile = null;
                }
                
                function formatFileSize(bytes) {
                    if (bytes === 0) return '0 Bytes';
                    const k = 1024;
                    const sizes = ['Bytes', 'KB', 'MB', 'GB'];
                    const i = Math.floor(Math.log(bytes) / Math.log(k));
                    return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
                }
                
                function uploadAndSendMedia(file, messageData) {
                    const formData = new FormData();
                    formData.append('media', file);
                    formData.append('roomId', currentRoom);
                    
                    // Get authentication token
                    const sessionData = localStorage.getItem('authSession');
                    let token = null;
                    
                    if (sessionData) {
                        try {
                            const parsed = JSON.parse(sessionData);
                            token = parsed.token;
                            console.log('Token from authSession:', token ? 'FOUND' : 'NOT FOUND');
                        } catch (error) {
                            console.error('Error parsing session data:', error);
                        }
                    }
                    
                    // Fallback to old method
                    if (!token) {
                        token = localStorage.getItem('token');
                        console.log('Token from localStorage:', token ? 'FOUND' : 'NOT FOUND');
                    }
                    
                    console.log('Final token status:', token ? 'PRESENT' : 'MISSING');
                    console.log('Token length:', token ? token.length : 0);
                    
                    // Show upload indicator
                    const uploadIndicator = document.createElement('div');
                    uploadIndicator.className = 'upload-indicator';
                    uploadIndicator.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Uploading...';
                    document.querySelector('.chat-input-container').appendChild(uploadIndicator);
                    
                    const headers = {};
                    if (token) {
                        headers['Authorization'] = `Bearer ${token}`;
                    }
                    
                    fetch('/api/meeting/upload-media', {
                        method: 'POST',
                        headers: headers,
                        body: formData
                    })
                    .then(response => response.json())
                    .then(data => {
                        if (data.success) {
                            messageData.mediaUrl = data.mediaUrl;
                            messageData.mediaType = file.type;
                            messageData.fileName = file.name;
                            messageData.fileSize = file.size;
                            
                            videoConference.socket.emit('chat-message', messageData);
                            clearMediaPreview();
                        } else {
                            alert('Failed to upload media: ' + data.error);
                        }
                    })
                    .catch(error => {
                        console.error('Upload error:', error);
                        alert('Failed to upload media. Please try again.');
                    })
                    .finally(() => {
                        uploadIndicator.remove();
                    });
                }
                
                function addChatMessage(message) {
                    const messagesContainer = document.getElementById('chat-messages');
                    const messageElement = document.createElement('div');
                    messageElement.className = `chat-message ${message.userId === currentUser.id ? 'own' : 'other'}`;
                    
                    const messageTime = new Date(message.timestamp).toLocaleTimeString([], { 
                        hour: '2-digit', 
                        minute: '2-digit' 
                    });
                    
                    let messageContent = `
                        <div class="message-info">${message.username}</div>
                    `;
                    
                    // Add text message if present
                    if (message.message && message.message.trim()) {
                        messageContent += `<div class="message-text">${message.message}</div>`;
                    }
                    
                    // Add media content if present
                    if (message.mediaUrl) {
                        messageContent += `<div class="media-content">`;
                        
                        if (message.mediaType.startsWith('image/')) {
                            messageContent += `<img src="${message.mediaUrl}" alt="${message.fileName}" onclick="window.open('${message.mediaUrl}', '_blank')">`;
                        } else if (message.mediaType.startsWith('video/')) {
                            messageContent += `<video controls><source src="${message.mediaUrl}" type="${message.mediaType}"></video>`;
                        } else if (message.mediaType.startsWith('audio/')) {
                            messageContent += `<audio controls><source src="${message.mediaUrl}" type="${message.mediaType}"></audio>`;
                        } else {
                            // For documents and other files
                            const fileIcon = getFileIcon(message.mediaType);
                            messageContent += `
                                <a href="${message.mediaUrl}" target="_blank" class="media-file-link">
                                    <i class="${fileIcon}"></i>
                                    <span>${message.fileName}</span>
                                </a>
                            `;
                        }
                        
                        messageContent += `</div>`;
                    }
                    
                    messageContent += `<div class="message-time">${messageTime}</div>`;
                    messageElement.innerHTML = messageContent;
                    
                    messagesContainer.appendChild(messageElement);
                    messagesContainer.scrollTop = messagesContainer.scrollHeight;
                    
                    // Add animation effect
                    messageElement.style.opacity = '0';
                    messageElement.style.transform = 'translateY(20px)';
                    setTimeout(() => {
                        messageElement.style.transition = 'all 0.3s ease-out';
                        messageElement.style.opacity = '1';
                        messageElement.style.transform = 'translateY(0)';
                    }, 10);
                    
                    // Show chat badge for new messages from others
                    if (message.userId !== currentUser.id) {
                        const badge = document.getElementById('chat-badge');
                        const currentCount = parseInt(badge.textContent) || 0;
                        badge.textContent = currentCount + 1;
                        badge.style.display = 'flex';
                        
                        // Add pulse animation to floating chat button
                        const floatingBtn = document.getElementById('floating-chat-btn');
                        floatingBtn.style.animation = 'pulse 0.6s ease-in-out 3';
                        setTimeout(() => {
                            floatingBtn.style.animation = '';
                        }, 1800);
                    }
                }
                
                function getFileIcon(mediaType) {
                    if (mediaType.includes('pdf')) return 'fas fa-file-pdf';
                    if (mediaType.includes('word') || mediaType.includes('document')) return 'fas fa-file-word';
                    if (mediaType.includes('excel') || mediaType.includes('spreadsheet')) return 'fas fa-file-excel';
                    if (mediaType.includes('powerpoint') || mediaType.includes('presentation')) return 'fas fa-file-powerpoint';
                    if (mediaType.includes('text')) return 'fas fa-file-alt';
                    if (mediaType.includes('zip') || mediaType.includes('rar')) return 'fas fa-file-archive';
                    return 'fas fa-file';
                }
                
                function leaveMeeting() {
                    if (videoConference) {
                        videoConference.disconnect();
                    }
                    window.location.href = '/dashboard.html';
                }
            });
        </script>

        <!-- Zen Mode JavaScript -->
        <script>
            let zenModeActive = false;
            let originalAudioConstraints = null;
            let originalVideoConstraints = null;
            let audioContext = null;
            let noiseSuppressionNode = null;
            let gainNode = null;

            // Hand Raise variables
            let handRaised = false;
            let raisedHands = new Map(); // userId -> { username, timestamp }

            // Low Light Mode variables
            let lowLightModeActive = false;
            let originalVideoSettings = null;

            function toggleZenMode() {
                const bubble = document.getElementById('zen-mode-bubble');
                const indicator = document.getElementById('zen-mode-indicator');
                const icon = document.getElementById('zen-mode-icon');
                
                zenModeActive = !zenModeActive;
                
                if (zenModeActive) {
                    activateZenMode();
                    bubble.classList.add('active');
                    indicator.classList.add('active');
                    icon.className = 'fas fa-spa';
                    document.body.classList.add('zen-mode-active');
                    
                    // Show notification
                    showZenNotification('🎙️ AI-Powered Noise Cancellation Activated - Background noise reduced');
                } else {
                    deactivateZenMode();
                    bubble.classList.remove('active');
                    indicator.classList.remove('active');
                    icon.className = 'fas fa-spa';
                    document.body.classList.remove('zen-mode-active');
                    
                    // Show notification
                    showZenNotification('🔇 AI-Powered Noise Cancellation Deactivated');
                }
            }

            function activateZenMode() {
                console.log('=== ACTIVATING ZEN MODE ===');
                
                // Check if localStream is available
                if (!videoConference || !videoConference.localStream) {
                    console.log('Local stream not available, enabling browser-level noise cancellation settings');
                    showZenNotification('🎙️ AI-Powered Noise Cancellation Ready - Allow camera/mic to activate');
                    monitorMediaAvailability();
                    return;
                }
                
                // Enhanced audio processing
                enhanceAudio();
                
                // Enhanced video processing
                enhanceVideo();
                
                // Apply noise cancellation
                applyNoiseCancellation();
                
                // Optimize network settings
                optimizeNetworkSettings();
            }

            function deactivateZenMode() {
                console.log('=== DEACTIVATING ZEN MODE ===');
                
                // Restore original audio settings
                if (videoConference && videoConference.localStream) {
                    restoreAudio();
                }
                
                // Restore original video settings
                restoreVideo();
                
                // Remove audio processing nodes
                if (audioContext) {
                    audioContext.close();
                    audioContext = null;
                }
            }

            function enhanceAudio() {
                try {
                    console.log('=== ENHANCING AUDIO FOR ZEN MODE ===');
                    
                    if (!videoConference || !videoConference.localStream) {
                        console.log('Cannot enhance audio: local stream not available');
                        return;
                    }
                    
                    // Create audio context if not exists
                    if (!audioContext) {
                        audioContext = new (window.AudioContext || window.webkitAudioContext)();
                        console.log('Audio context created');
                    }
                    
                    const audioTracks = videoConference.localStream.getAudioTracks();
                    if (audioTracks.length > 0) {
                        console.log('Processing audio track for enhancement');
                        
                        // Create audio source from local stream
                        const source = audioContext.createMediaStreamSource(videoConference.localStream);
                        
                        // Create noise suppression node with enhanced settings
                        noiseSuppressionNode = audioContext.createDynamicsCompressor();
                        noiseSuppressionNode.threshold.value = -60; // More aggressive
                        noiseSuppressionNode.knee.value = 30;       // Softer knee
                        noiseSuppressionNode.ratio.value = 15;       // Higher ratio
                        noiseSuppressionNode.attack.value = 0.001;   // Faster attack
                        noiseSuppressionNode.release.value = 0.1;    // Faster release
                        
                        // Create gain node for volume optimization
                        gainNode = audioContext.createGain();
                        gainNode.gain.value = 1.3; // Slightly higher gain
                        
                        // Create high-pass filter to remove low-frequency noise
                        const highPassFilter = audioContext.createBiquadFilter();
                        highPassFilter.type = 'highpass';
                        highPassFilter.frequency.value = 100; // Slightly higher cutoff
                        highPassFilter.Q.value = 0.7;
                        
                        // Create low-pass filter to remove high-frequency noise
                        const lowPassFilter = audioContext.createBiquadFilter();
                        lowPassFilter.type = 'lowpass';
                        lowPassFilter.frequency.value = 7000; // Slightly lower cutoff
                        lowPassFilter.Q.value = 0.7;
                        
                        // Create additional noise gate
                        const noiseGate = audioContext.createDynamicsCompressor();
                        noiseGate.threshold.value = -50;
                        noiseGate.knee.value = 10;
                        noiseGate.ratio.value = 20;
                        noiseGate.attack.value = 0.001;
                        noiseGate.release.value = 0.05;
                        
                        // Connect audio processing chain
                        source.connect(highPassFilter);
                        highPassFilter.connect(noiseGate);
                        noiseGate.connect(noiseSuppressionNode);
                        noiseSuppressionNode.connect(lowPassFilter);
                        lowPassFilter.connect(gainNode);
                        gainNode.connect(audioContext.destination);
                        
                        console.log('✅ Enhanced audio processing chain applied');
                        console.log('✅ Noise gate: -50dB threshold');
                        console.log('✅ Noise suppression: -60dB threshold');
                        console.log('✅ High-pass filter: 100Hz cutoff');
                        console.log('✅ Low-pass filter: 7000Hz cutoff');
                        console.log('✅ Gain boost: 1.3x');
                    } else {
                        console.log('No audio tracks found for enhancement');
                    }
                } catch (error) {
                    console.error('Error enhancing audio:', error);
                }
            }

            function enhanceVideo() {
                try {
                    if (!videoConference || !videoConference.localStream) {
                        console.log('Cannot enhance video: local stream not available');
                        return;
                    }
                    
                    const videoTracks = videoConference.localStream.getVideoTracks();
                    if (videoTracks.length > 0) {
                        console.log('Enhancing video quality...');
                        
                        // Apply video constraints for better quality
                        const videoTrack = videoTracks[0];
                        const capabilities = videoTrack.getCapabilities();
                        
                        if (capabilities) {
                            const enhancedConstraints = {
                                width: { ideal: capabilities.width?.max || 1920 },
                                height: { ideal: capabilities.height?.max || 1080 },
                                frameRate: { ideal: 30 },
                                aspectRatio: { ideal: 16/9 },
                                noiseReduction: true,
                                echoCancellation: true
                            };
                            
                            videoTrack.applyConstraints(enhancedConstraints)
                                .then(() => console.log('Video enhancement applied successfully'))
                                .catch(error => console.error('Error applying video constraints:', error));
                        }
                    }
                } catch (error) {
                    console.error('Error enhancing video:', error);
                }
            }

            function applyNoiseCancellation() {
                try {
                    console.log('=== APPLYING NOISE CANCELLATION ===');
                    
                    if (!videoConference || !videoConference.localStream) {
                        console.log('Cannot apply noise cancellation: local stream not available');
                        return;
                    }
                    
                    // Enable browser's built-in noise suppression
                    const audioTracks = videoConference.localStream.getAudioTracks();
                    if (audioTracks.length > 0) {
                        const audioTrack = audioTracks[0];
                        
                        // Get current constraints to see what's supported
                        const currentConstraints = audioTrack.getConstraints();
                        console.log('Current audio constraints:', currentConstraints);
                        
                        // Apply enhanced noise cancellation constraints
                        const constraints = {
                            noiseSuppression: true,
                            echoCancellation: true,
                            autoGainControl: true,
                            sampleRate: 48000,
                            channelCount: 1,
                            latency: 0.01
                        };
                        
                        console.log('Applying noise cancellation constraints:', constraints);
                        
                        audioTrack.applyConstraints(constraints)
                            .then(() => {
                                console.log('✅ Noise cancellation applied successfully');
                                console.log('✅ Echo cancellation enabled');
                                console.log('✅ Auto gain control enabled');
                                
                                // Verify the constraints were applied
                                const appliedConstraints = audioTrack.getConstraints();
                                console.log('Applied constraints:', appliedConstraints);
                                
                                // Get actual settings to confirm
                                const settings = audioTrack.getSettings();
                                console.log('Audio settings:', {
                                    noiseSuppression: settings.noiseSuppression,
                                    echoCancellation: settings.echoCancellation,
                                    autoGainControl: settings.autoGainControl,
                                    sampleRate: settings.sampleRate
                                });
                            })
                            .catch(error => {
                                console.error('Error applying noise cancellation:', error);
                                // Try with basic constraints as fallback
                                const basicConstraints = {
                                    noiseSuppression: true,
                                    echoCancellation: true
                                };
                                return audioTrack.applyConstraints(basicConstraints);
                            })
                            .then(() => {
                                console.log('✅ Basic noise cancellation applied as fallback');
                            })
                            .catch(error => {
                                console.error('Failed to apply even basic noise cancellation:', error);
                            });
                    } else {
                        console.log('No audio tracks found');
                    }
                } catch (error) {
                    console.error('Error in applyNoiseCancellation:', error);
                }
            }

            function optimizeNetworkSettings() {
                try {
                    // Optimize for better quality
                    if (videoConference && videoConference.peers) {
                        videoConference.peers.forEach((peerConnection, userId) => {
                            // Set higher bitrate for better quality
                            const senders = peerConnection.getSenders();
                            senders.forEach(sender => {
                                if (sender.track && sender.track.kind === 'video') {
                                    const parameters = sender.getParameters();
                                    if (parameters.encodings) {
                                        parameters.encodings[0].maxBitrate = 2000000; // 2 Mbps
                                        sender.setParameters(parameters);
                                    }
                                }
                            });
                        });
                    }
                } catch (error) {
                    console.error('Error optimizing network settings:', error);
                }
            }

            function restoreAudio() {

                        audioContext.close();
                        audioContext = null;

                } catch (error) {

            // Hand Raise Functions
            function toggleHandRaise() {
                const bubble = document.getElementById('hand-raise-bubble');
                const indicator = document.getElementById('hand-raise-indicator');
                const icon = document.getElementById('hand-raise-icon');
                const tooltip = document.querySelector('.hand-raise-tooltip');
                
                handRaised = !handRaised;
                
                if (handRaised) {
                    // Raise hand
                    bubble.classList.add('active');

                    icon.className = 'fas fa-hand-paper'; // Show raised hand

                    showHandNotification('✋ Hand Raised - You are in the queue to speak');

                    // Lower hand
                    bubble.classList.remove('active');
                    indicator.classList.remove('active');
                    icon.className = 'fas fa-hand-paper'; // Keep hand icon visible
                    tooltip.textContent = 'Raise Hand';
                    
                    // Emit hand lower event
                    if (videoConference && videoConference.socket) {
                        videoConference.socket.emit('hand-raise', {

                        });

            function getCurrentUserId() {
                // Get current user ID from auth session
                const authSession = localStorage.getItem('authSession');
                if (authSession) {
                    try {
                        const user = JSON.parse(authSession);
                        return user.id || user.userId;
                    } catch (e) {
                        console.error('Error parsing auth session:', e);
                    }
                }
                return null;
            }

            function getCurrentUsername() {
                // Get current username from auth session
                const authSession = localStorage.getItem('authSession');
                if (authSession) {
                    try {
                        const user = JSON.parse(authSession);
                        return user.username || user.name || 'Anonymous';
                    } catch (e) {
                        console.error('Error parsing auth session:', e);
                    }
                }
                return 'Anonymous';
            }

                // Create notification element
                const notification = document.createElement('div');
                notification.style.cssText = `

            function handleHandRaise(data) {
                console.log('Hand raise event received:', data);
                
                if (data.action === 'raise') {
                    // Add to raised hands
                    raisedHands.set(data.userId, {
                        username: data.username,
                        timestamp: Date.now()
                    });
                    
                    // Show notification if it's not the current user
                    if (data.userId !== getCurrentUserId()) {
                        showHandNotification(`✋ ${data.username} raised their hand`);
                    }
                    
                    // Update UI to show raised hands
                    updateRaisedHandsList();
                    
                } else if (data.action === 'lower') {
                    // Remove from raised hands
                    raisedHands.delete(data.userId);
                    
                    // Show notification if it's not the current user
                    if (data.userId !== getCurrentUserId()) {
                        showHandNotification(`👇 ${data.username} lowered their hand`);
                    }
                    
                    // Update UI
                    updateRaisedHandsList();
                }
            }

            function updateRaisedHandsList() {
                // Create or update raised hands list
                let handsList = document.getElementById('raised-hands-list');
                
                if (!handsList) {
                    // Create the container if it doesn't exist
                    handsList = document.createElement('div');
                    handsList.id = 'raised-hands-list';
                    handsList.style.cssText = `
                        position: fixed;
                        top: 80px;
                        left: 20px;
                        background: rgba(0, 0, 0, 0.8);
                        color: white;
                        padding: 15px;
                        border-radius: 10px;
                        max-width: 250px;
                        z-index: 1000;
                        backdrop-filter: blur(10px);
                        border: 1px solid rgba(255, 255, 255, 0.2);
                        display: none;
                    `;
                    document.body.appendChild(handsList);
                }
                
                if (raisedHands.size > 0) {
                    // Sort by timestamp (who raised first)
                    const sortedHands = Array.from(raisedHands.entries())
                        .sort((a, b) => a[1].timestamp - b[1].timestamp);
                    
                    let listHTML = '<h6 style="margin: 0 0 10px 0; font-size: 14px;">📋 Raised Hands:</h6>';
                    sortedHands.forEach(([userId, data], index) => {
                        const timeAgo = getTimeAgo(data.timestamp);
                        listHTML += `
                            <div style="display: flex; justify-content: space-between; align-items: center; padding: 5px 0; border-bottom: 1px solid rgba(255,255,255,0.1);">
                                <span>${index + 1}. ${data.username}</span>
                                <small style="opacity: 0.7;">${timeAgo}</small>
                            </div>
                        `;
                    });
                    
                    handsList.innerHTML = listHTML;
                    handsList.style.display = 'block';
                } else {
                    handsList.style.display = 'none';
                }
            }

            function getTimeAgo(timestamp) {
                const seconds = Math.floor((Date.now() - timestamp) / 1000);
                
                if (seconds < 60) return 'just now';
                if (seconds < 3600) return Math.floor(seconds / 60) + 'm ago';
                return Math.floor(seconds / 3600) + 'h ago';
            }

            function setupHandRaiseSocketEvents() {
                if (videoConference && videoConference.socket) {
                    videoConference.socket.on('hand-raise', handleHandRaise);

            // Low Light Mode Functions
            function toggleLowLightMode() {
                const bubble = document.getElementById('low-light-bubble');
                const indicator = document.getElementById('low-light-indicator');
                const icon = document.getElementById('low-light-icon');
                const tooltip = document.querySelector('.low-light-tooltip');
                
                lowLightModeActive = !lowLightModeActive;
                
                if (lowLightModeActive) {
                    // Activate low light mode
                    bubble.classList.add('active');
                    indicator.classList.add('active');
                    icon.className = 'fas fa-moon';
                    tooltip.textContent = 'Disable Low Light';
                    
                    // Apply low light enhancements
                    activateLowLightMode();
                    
                    showLowLightNotification('🌙 Low Light Mode Activated - 1080p HD with automatic brightness optimization for dark environments');
                } else {
                    // Deactivate low light mode
                    bubble.classList.remove('active');
                    indicator.classList.remove('active');
                    icon.className = 'fas fa-moon';
                    tooltip.textContent = 'Low Light Mode';
                    
                    // Restore original video settings
                    deactivateLowLightMode();
                    
                    showLowLightNotification('☀️ Low Light Mode Deactivated');
                }
            }

            function activateLowLightMode() {
                try {
                    console.log('=== ACTIVATING LOW LIGHT MODE ===');
                    
                    if (!videoConference || !videoConference.localStream) {
                        console.log('Cannot activate low light mode: local stream not available');
                        showLowLightNotification('🌙 Low Light Mode Ready - Allow camera to activate');
                        return;
                    }
                    
                    const videoTracks = videoConference.localStream.getVideoTracks();
                    if (videoTracks.length > 0) {
                        const videoTrack = videoTracks[0];
                        
                        // Store current settings
                        const currentSettings = videoTrack.getSettings();
                        originalVideoSettings = {
                            width: currentSettings.width,
                            height: currentSettings.height,
                            frameRate: currentSettings.frameRate,
                            brightness: currentSettings.brightness,
                            contrast: currentSettings.contrast,
                            saturation: currentSettings.saturation
                        };
                        
                        // Apply low light optimizations with 1080p HD quality and enhanced brightness
                        const lowLightConstraints = {
                            width: { ideal: 1920, max: 1920 },
                            height: { ideal: 1080, max: 1080 },
                            frameRate: { ideal: 30, max: 60 },
                            // Enhanced camera settings for low light conditions (MediaTrackConstraints only)
                            brightness: { ideal: 1.5, max: 2.0 },
                            contrast: { ideal: 1.3, max: 1.5 },
                            // Advanced settings that work with MediaTrackConstraints
                            whiteBalanceMode: 'continuous',
                            exposureMode: 'continuous',
                            focusMode: 'continuous',
                            // Torch can be enabled if needed for very dark environments
                            torch: false
                        };
                        
                        videoTrack.applyConstraints(lowLightConstraints)
                            .then(() => {
                                console.log('Enhanced 1080p HD low light mode with automatic brightness optimization applied successfully');
                                applyVideoFilters();
                            })
                            .catch(error => {
                                console.warn('Enhanced constraints failed, trying basic low light mode:', error.message);
                                
                                // Fallback to basic constraints that work on most browsers
                                const basicLowLightConstraints = {
                                    width: { ideal: 1920, max: 1920 },
                                    height: { ideal: 1080, max: 1080 },
                                    frameRate: { ideal: 30, max: 60 }
                                };
                                
                                return videoTrack.applyConstraints(basicLowLightConstraints);
                            })
                            .then(() => {
                                console.log('Basic low light mode applied successfully');
                                applyVideoFilters();
                            })
                            .catch(error => {
                                console.error('All low light constraint attempts failed, using CSS filters only:', error);
                                // Final fallback - just use CSS filters
                                applyVideoFilters();
                            });
                    }
                } catch (error) {
                    console.error('Error activating low light mode:', error);
                }
            }

            function applyVideoFilters() {
                try {
                    // Apply CSS filters to enhance video in low light
                    const localVideo = document.querySelector('video[local="true"]');
                    const remoteVideos = document.querySelectorAll('video:not([local="true"])');
                    
                    // Apply enhanced CSS filters for 1080p low light video
                    const lowLightFilters = [
                        'brightness(1.8)',
                        'contrast(1.5)',
                        'saturate(1.4)',
                        'gamma(1.2)',
                        'sharpen(1.1)'
                    ].join(' ');
                    
                    // Apply to local video
                    if (localVideo) {
                        localVideo.style.filter = lowLightFilters;
                        localVideo.classList.add('low-light-enhanced');
                    }
                    
                    // Apply to remote videos
                    remoteVideos.forEach(video => {
                        video.style.filter = lowLightFilters;
                        video.classList.add('low-light-enhanced');
                    });
                    
                    console.log('Low light video filters applied');
                } catch (error) {
                    console.error('Error applying video filters:', error);
                }
            }

            function deactivateLowLightMode() {
                try {
                    console.log('=== DEACTIVATING LOW LIGHT MODE ===');
                    
                    // Restore original video constraints
                    if (videoConference && videoConference.localStream && originalVideoSettings) {
                        const videoTracks = videoConference.localStream.getVideoTracks();
                        if (videoTracks.length > 0) {
                            const videoTrack = videoTracks[0];
                            
                            const restoreConstraints = {
                                width: { ideal: originalVideoSettings.width },
                                height: { ideal: originalVideoSettings.height },
                                frameRate: { ideal: originalVideoSettings.frameRate }
                            };
                            
                            videoTrack.applyConstraints(restoreConstraints)
                                .then(() => console.log('Original video settings restored'))
                                .catch(error => console.error('Error restoring video settings:', error));
                        }
                    }
                    
                    // Remove video filters
                    const enhancedVideos = document.querySelectorAll('.low-light-enhanced');
                    enhancedVideos.forEach(video => {
                        video.style.filter = '';
                        video.classList.remove('low-light-enhanced');
                    });
                    
                    console.log('Low light mode deactivated');
                } catch (error) {
                    console.error('Error deactivating low light mode:', error);
                }
            }

            function showLowLightNotification(message) {
                // Create notification element
                const notification = document.createElement('div');
                notification.style.cssText = `
                    position: fixed;
                    top: 200px;

                    background: linear-gradient(135deg, rgba(63, 81, 181, 0.9) 0%, rgba(33, 150, 243, 0.9) 100%);

                    box-shadow: 0 4px 20px rgba(63, 81, 181, 0.4);
                    animation: slideInRight 0.3s ease-out;
                    backdrop-filter: blur(10px);
                    border: 1px solid rgba(255, 255, 255, 0.2);
                `;
                notification.textContent = message;
                
                document.body.appendChild(notification);
                
                // Remove notification after 3 seconds
                setTimeout(() => {
                    notification.style.animation = 'slideOutRight 0.3s ease-in';
                    setTimeout(() => {
                        if (document.body.contains(notification)) {
                            document.body.removeChild(notification);
                        }

                }, 3000);
            }

            // Auto-activate low light mode when media becomes available
            function monitorLowLightMediaAvailability() {
                const checkInterval = setInterval(() => {
                    if (lowLightModeActive && videoConference && videoConference.localStream) {
                        console.log('Media became available, activating low light mode');
                        activateLowLightMode();
                        clearInterval(checkInterval);
                    }
                }, 1000);
                
                // Stop checking after 30 seconds
                setTimeout(() => clearInterval(checkInterval), 30000);
            }
        </script>
