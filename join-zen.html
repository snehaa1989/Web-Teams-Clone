<!DOCTYPE html>
<html>
    <head>
        <title>Join a Zen - Zenference</title>
        <meta content="width=device-width, initial-scale=1" name="viewport" />
        
        <!-- Bootstrap CSS -->
        <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css">
        <!-- Font Awesome -->
        <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.7.2/css/all.css">
        <!-- Custom CSS -->
        <link rel='stylesheet' href='css/style.css' type="text/css">
        
        <style>
            .meeting-container {
                min-height: 100vh;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 20px;
            }
            
            .meeting-card {
                background: rgba(255, 255, 255, 0.1);
                backdrop-filter: blur(20px);
                border: 1px solid rgba(255, 255, 255, 0.2);
                border-radius: 20px;
                padding: 40px;
                max-width: 500px;
                width: 100%;
            }
            
            .form-control {
                background: rgba(255, 255, 255, 0.1);
                border: 1px solid rgba(255, 255, 255, 0.2);
                color: white;
                border-radius: 10px;
                padding: 15px;
                font-size: 16px;
                transition: all 0.3s ease;
            }
            
            .form-control:focus {
                background: rgba(255, 255, 255, 0.15);
                border-color: #667eea;
                box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.3);
                outline: none;
            }
            
            .btn-primary {
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                border: none;
                color: white;
                border-radius: 10px;
                padding: 15px 30px;
                font-size: 16px;
                font-weight: 600;
                transition: all 0.3s ease;
                box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
            }
            
            .btn-primary:hover {
                transform: translateY(-2px);
                box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
            }
            
            .text-white {
                color: white !important;
            }
            
            .error-message {
                background: rgba(220, 53, 69, 0.1);
                border: 1px solid rgba(220, 53, 69, 0.3);
                color: #ff6b6b;
                padding: 10px;
                border-radius: 8px;
                margin-bottom: 15px;
            }
            
            .meeting-info {
                background: rgba(255, 255, 255, 0.05);
                border: 1px solid rgba(255, 255, 255, 0.1);
                border-radius: 10px;
                padding: 15px;
                margin-bottom: 20px;
            }
        </style>
    </head>
    
    <body id="dark-mode">
        <!-- Navigation Bar -->
        <nav class="navbar fixed-top rounded-0 d-print-none glass-card" style="background: linear-gradient(90deg, var(--sea-blue) 0%, var(--sea-green) 50%, var(--light-pink) 100%); border-bottom: 2px solid var(--glass-border);">
            <div class="text-white" id='meeting-topic' style="font-weight: 600; text-shadow: 0 2px 4px rgba(0,0,0,0.3);">
                <i class="fas fa-video mr-2"></i>Join Zen Meeting 🍃
            </div>
            <div class="ml-auto d-flex align-items-center">
                <!-- User Info -->
                <div class="user-info mr-3 text-white" id="user-info" style="display: none;">
                    <div class="d-flex align-items-center">
                        <i class="fas fa-user-circle mr-2" style="font-size: 20px;"></i>
                        <div>
                            <div class="user-name" id="user-name" style="font-weight: 700; font-size: 14px;">User</div>
                            <div class="user-email" id="user-email" style="font-size: 12px; opacity: 0.8;">user@example.com</div>
                        </div>
                    </div>
                </div>
                
                <!-- Back to Dashboard Button -->
                <button class="btn btn-sm rounded-0 btn-no-effect text-white ml-2" onclick="backToDashboard()" title="Back to Dashboard">
                    <i class="fa fa-arrow-left"></i> <span class="d-none d-md-inline">Dashboard</span>
                </button>
                
                <!-- Logout Button -->
                <button class="btn btn-sm rounded-0 btn-no-effect text-white ml-2" id='logout-btn' title="Logout">
                    <i class="fa fa-sign-out-alt"></i> <span class="d-none d-md-inline">Logout</span>
                </button>
            </div>
        </nav>

        <!-- Join Zen Content -->
        <div class="meeting-container">
            <div class="meeting-card">
                <div class="text-center mb-4">
                    <div style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; width: 80px; height: 80px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 36px; box-shadow: 0 8px 25px rgba(102, 126, 234, 0.3);">
                        <i class="fas fa-video"></i>
                    </div>
                    <h2 class="text-white mb-3" style="font-weight: 700;">Join a Zen Meeting</h2>
                    <p class="text-white" style="opacity: 0.9;">Enter the Zen ID to join the meeting</p>
                </div>
                
                <!-- Meeting Info (will be populated if meeting found) -->
                <div id="meeting-info" class="meeting-info" style="display: none;">
                    <h5 class="text-white mb-3"><i class="fas fa-info-circle mr-2"></i>Meeting Details</h5>
                    <div id="meeting-details" class="text-white">
                        <!-- Meeting details will be populated here -->
                    </div>
                </div>
                
                <div id="error-container"></div>
                
                <form id="join-form">
                    <div class="form-group mb-3">
                        <label for="zen-id" class="text-white font-weight-600 mb-2">
                            <i class="fas fa-hashtag mr-2"></i>Zen ID
                        </label>
                        <input type="text" class="form-control w-100" id='zen-id' placeholder="Enter Zen ID (e.g., zen_1234567890_abc123)" autocomplete="off" required>
                        <small class="text-white" style="opacity: 0.7;">You can find the Zen ID in your invitation email</small>
                    </div>
                    
                    <div class="form-group mb-4">
                        <label for="username" class="text-white font-weight-600 mb-2">
                            <i class="fas fa-user mr-2"></i>Your Name
                        </label>
                        <input type="text" class="form-control w-100" id='username' placeholder="Enter your name" autocomplete="off" required>
                    </div>
                    
                    <button type="submit" class="btn btn-primary w-100" id='join-zen-btn'>
                        <i class="fas fa-door-open mr-2"></i>Join Zen Meeting
                    </button>
                </form>
                
                <div class="text-center mt-4">
                    <p class="text-white" style="opacity: 0.7; font-size: 14px;">
                        <i class="fas fa-lightbulb mr-1"></i>
                        Make sure you have a stable internet connection and enabled camera/microphone
                    </p>
                </div>
            </div>
        </div>

        <!-- Scripts -->
        <script src='/socket.io/socket.io.js'></script>
        <script type="module" src="js/auth.js"></script>
        <script type="module" src='js/webrtc.js'></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/webrtc-adapter/7.3.0/adapter.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.24.0/moment.min.js"></script>
        
        <script>
            document.addEventListener('DOMContentLoaded', () => {
                // Check authentication status
                const sessionData = localStorage.getItem('authSession');
                if (!sessionData) {
                    window.location.href = '/';
                    return;
                }
                
                try {
                    const parsed = JSON.parse(sessionData);
                    const sessionStart = new Date(parsed.sessionStart);
                    const lastActivity = new Date(parsed.lastActivity);
                    const now = new Date();
                    
                    // Check if session is valid
                    const sessionAge = now - sessionStart;
                    const maxSessionAge = 24 * 60 * 60 * 1000; // 24 hours
                    const inactivityTime = now - lastActivity;
                    const maxInactivity = 10 * 60 * 1000; // 10 minutes
                    
                    if (sessionAge > maxSessionAge || inactivityTime > maxInactivity || !parsed.token || !parsed.user) {
                        localStorage.removeItem('authSession');
                        localStorage.removeItem('token');
                        localStorage.removeItem('user');
                        alert('Session expired. Please login again.');
                        window.location.href = '/';
                        return;
                    }
                } catch (error) {
                    console.error('Error parsing session data:', error);
                    window.location.href = '/';
                    return;
                }

                // Display user information in navbar
                const userInfo = document.getElementById('user-info');
                const userName = document.getElementById('user-name');
                const userEmail = document.getElementById('user-email');
                
                if (userInfo && userName && userEmail) {
                    const sessionData = localStorage.getItem('authSession');
                    if (sessionData) {
                        try {
                            const parsed = JSON.parse(sessionData);
                            if (parsed.user) {
                                userName.textContent = parsed.user.username || 'User';
                                userEmail.textContent = parsed.user.email || 'user@example.com';
                                userInfo.style.display = 'block';
                            }
                        } catch (error) {
                            console.error('Error parsing user data:', error);
                        }
                    }
                }

                // Get Zen ID from URL if present
                const urlParams = new URLSearchParams(window.location.search);
                const zenId = urlParams.get('zen');
                if (zenId) {
                    document.getElementById('zen-id').value = zenId;
                    fetchMeetingDetails(zenId);
                }

                // Handle form submission
                const joinForm = document.getElementById('join-form');
                const joinBtn = document.getElementById('join-zen-btn');
                
                joinForm.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    
                    const zenIdInput = document.getElementById('zen-id').value.trim();
                    const usernameInput = document.getElementById('username').value.trim();
                    
                    if (!zenIdInput || !usernameInput) {
                        showError('Please enter both Zen ID and your name');
                        return;
                    }
                    
                    // Disable button and show loading
                    joinBtn.disabled = true;
                    joinBtn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>Joining...';
                    
                    try {
                        // Redirect to meeting page with parameters
                        const meetingUrl = `/meeting.html?zen=${encodeURIComponent(zenIdInput)}&username=${encodeURIComponent(usernameInput)}`;
                        window.location.href = meetingUrl;
                    } catch (error) {
                        console.error('Error joining meeting:', error);
                        showError('Failed to join meeting. Please try again.');
                        joinBtn.disabled = false;
                        joinBtn.innerHTML = '<i class="fas fa-door-open mr-2"></i>Join Zen Meeting';
                    }
                });
            });

            // Fetch meeting details (optional - for future enhancement)
            async function fetchMeetingDetails(zenId) {
                try {
                    const response = await fetch(`/api/zen/meeting/${zenId}`);
                    if (response.ok) {
                        const meeting = await response.json();
                        displayMeetingInfo(meeting);
                    }
                } catch (error) {
                    console.error('Error fetching meeting details:', error);
                }
            }

            // Display meeting information
            function displayMeetingInfo(meeting) {
                const meetingInfo = document.getElementById('meeting-info');
                const meetingDetails = document.getElementById('meeting-details');
                
                if (meeting.success && meeting.data) {
                    const data = meeting.data;
                    meetingDetails.innerHTML = `
                        <div class="mb-2"><strong>📅 Date:</strong> ${data.date || 'TBD'}</div>
                        <div class="mb-2"><strong>⏰ Time:</strong> ${data.time || 'TBD'}</div>
                        <div class="mb-2"><strong>⏱️ Duration:</strong> ${data.duration || '60'} minutes</div>
                        <div class="mb-2"><strong>👤 Host:</strong> ${data.host?.username || 'Unknown'}</div>
                        <div class="mb-2"><strong>📝 Topic:</strong> ${data.topic || 'Meeting'}</div>
                    `;
                    meetingInfo.style.display = 'block';
                }
            }

            // Show error message
            function showError(message) {
                const errorContainer = document.getElementById('error-container');
                errorContainer.innerHTML = `
                    <div class="error-message">
                        <i class="fas fa-exclamation-triangle mr-2"></i>${message}
                    </div>
                `;
                
                // Auto-hide after 5 seconds
                setTimeout(() => {
                    errorContainer.innerHTML = '';
                }, 5000);
            }

            // Back to dashboard function
            window.backToDashboard = function() {
                window.location.href = '/dashboard.html';
            };

            // Handle logout
            const logoutBtn = document.getElementById('logout-btn');
            if (logoutBtn) {
                logoutBtn.addEventListener('click', () => {
                    if (confirm('Are you sure you want to logout?')) {
                        localStorage.clear();
                        sessionStorage.clear();
                        logoutBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Logging out...';
                        logoutBtn.disabled = true;
                        setTimeout(() => {
                            window.location.href = '/';
                        }, 1000);
                    }
                });
            }
        </script>
    </body>
</html>
