<!DOCTYPE html>
<html>
    <head>
        <title>Start New Meeting - Zenference</title>
        <meta content="width=device-width, initial-scale=1" name="viewport" />
        <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css">
        <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.7.2/css/all.css">
        <link rel='stylesheet' href='css/style.css' type="text/css">
        <link rel='stylesheet' href='css/start-zen-new.css' type="text/css">
        <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/js/bootstrap.bundle.min.js"></script>
        <script src="js/auth.js"></script>
        <script src="js/start-zen-new.js"></script>
    </head>
    <body>
        <nav class="navbar fixed-top rounded-0 d-print-none glass-card" style="background: linear-gradient(90deg, var(--sea-blue) 0%, var(--sea-green) 50%, var(--light-pink) 100%); border-bottom: 2px solid var(--glass-border);">
            <div class="text-white" id='meeting-topic' style="font-weight: 600; text-shadow: 0 2px 4px rgba(0,0,0,0.3);">Zenference 🍃</div>
            <div class="ml-auto d-flex align-items-center">
                <button class="btn btn-sm rounded-0 btn-no-effect text-white ml-2" onclick="backToDashboard()" title="Back to Dashboard">
                    <i class="fa fa-arrow-left"></i> <span class="d-none d-md-inline">Dashboard</span>
                </button>
                <button class="btn btn-sm rounded-0 btn-no-effect text-white ml-2" onclick="handleLogout()" title="Logout">
                    <i class="fa fa-sign-out-alt"></i> <span class="d-none d-md-inline">Logout</span>
                </button>
            </div>
        </nav>
        <div class="container mt-5">
            <div class="row justify-content-center">
                <div class="col-md-6 offset-md-3">
                    <div class="card glass-card">
                        <div class="card-body text-center">
                            <div class="mb-4">
                                <i class="fas fa-plus-circle" style="font-size: 48px; color: var(--sea-blue);"></i>
                            </div>
                            <h4 class="text-white mb-3" style="font-weight: 700;">Start a New Zen</h4>
                            <p class="text-white mb-4" style="font-weight: 600;">Create a new zen room and invite participants</p>
                            <form id="startMeetingForm">
                                <div class="form-group">
                                    <input type="text" class="form-control glass-card mb-3" id="meetingTopic" placeholder="Enter meeting topic" style="background: var(--glass-bg); border: 1px solid var(--glass-border); color: var(--light-text);">
                                </div>
                                <button type="submit" class="btn btn-primary btn-block">
                                    <i class="fas fa-video mr-2"></i>Start Zen
                                </button>
                            </form>
                            <div class="mt-3">
                                <small class="text-muted">Or</small>
                                <a href="/join-zen.html" class="btn btn-outline-light btn-block mt-2">
                                    <i class="fas fa-sign-in-alt mr-2"></i>Join Existing Zen
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div id="meetingReady" class="container mt-5" style="display: none;">
            <div class="row justify-content-center">
                <div class="col-md-8">
                    <div class="card glass-card">
                        <div class="card-body text-center">
                            <h3 class="text-white mb-3">
                                <i class="fas fa-check-circle mb-3" style="font-size: 48px; color: var(--sea-green);"></i>
                            </h3>
                            <h4 class="text-white mb-3">Your Zen is Ready!</h4>
                            <p class="text-white mb-4">Share this link with participants:</p>
                            <div class="input-group">
                                <input type="text" id="meetingLink" class="form-control link-input" readonly style="background: var(--glass-bg); border: 1px solid var(--glass-border); color: var(--light-text);">
                                <div class="input-group-append">
                                    <button id="copyLinkBtn" class="copy-btn" onclick="copyMeetingLink()">
                                        <i class="fas fa-copy"></i> Copy Link
                                    </button>
                                </div>
                            </div>
                            <button class="btn btn-primary btn-block" id="joinMeetingBtn">
                                <i class="fas fa-door-open mr-2"></i>Join Meeting Now
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        </body>
</html>
