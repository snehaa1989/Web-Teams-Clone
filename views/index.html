<!DOCTYPE html>
<html>
    <head>
        <title>Zenference - Video Conferencing</title>
        <meta content="width=device-width, initial-scale=1" name="viewport" />
        <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css" integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">
        <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.7.2/css/all.css" integrity="sha384-fnmOCqbTlWIlj8LyTjo7mOUStjsKC4pOpQbqyi7RrhN7udi9RwhKkMHpvLbHG9Sr" crossorigin="anonymous">
        <link rel='stylesheet' href='css/style.css' type="text/css">
        <script src='/socket.io/socket.io.js'></script>
        <script type="module" src="js/auth.js"></script>
        <script type="module" src='js/webrtc.js'></script>
        <script type="module" src='js/events.js'></script>
        <script src="js/index.js"></script>
    </head>
    <body id="dark-mode">
        <div id="auth-container" class="container-fluid d-flex align-items-center justify-content-center" style="min-height: 100vh; position: relative; z-index: 10; display: flex;">
            <div class="row w-100">
                <div class="col-md-6 offset-md-3">
                    <div class="card glass-card" style="animation: slideUp 0.8s ease-out;">
                        <div class="card-body">
                            <h2 class="text-center mb-4" style="color: var(--light-text); font-weight: 700; text-shadow: 0 2px 4px rgba(0,0,0,0.3);">Zenference</h2>
                            <p class="text-center mb-4 mx-auto" style="color: var(--medium-text); font-weight: 600; max-width: 300px;">Zen meetings, simplified.. 🍃</p>
                            <div id="login-form">
                                <h4 class="text-center mb-3" style="color: var(--medium-text); font-weight: 600;">Login</h4>
                                <div class="form-group">
                                    <label for="login-email" style="color: var(--medium-text); font-weight: 600;">Email</label>
                                    <input type="email" class="form-control glass-card" id="login-email" placeholder="Enter your email" style="background: var(--glass-bg); border: 1px solid var(--glass-border); color: var(--light-text);">
                                </div>
                                <div class="form-group">
                                    <label for="login-password" style="color: var(--medium-text); font-weight: 600;">Password</label>
                                    <input type="password" class="form-control glass-card" id="login-password" placeholder="Enter your password" style="background: var(--glass-bg); border: 1px solid var(--glass-border); color: var(--light-text);">
                                </div>
                                <button onclick="handleLogin()" id="login-btn" class="btn btn-primary btn-block glass-card" style="background: linear-gradient(135deg, var(--sea-blue) 0%, var(--sea-green) 50%, var(--light-pink) 100%); border: none; color: var(--light-text); font-weight: 600;">Login</button>
                                <p class="text-center mt-3">
                                    <a href="#" onclick="toggleAuthForm()" id="toggle-auth-form-link">Don't have an account? Register</a>
                                </p>
                            </div>
                            <div id="register-form" style="display: none;">
                                <h4 class="text-center mb-3" style="color: var(--medium-text); font-weight: 600;">Register</h4>
                                <div class="form-group">
                                    <label for="register-username" style="color: var(--medium-text); font-weight: 600;">Username</label>
                                    <input type="text" class="form-control glass-card" id="register-username" placeholder="Choose a username" style="background: var(--glass-bg); border: 1px solid var(--glass-border); color: var(--light-text);">
                                </div>
                                <div class="form-group">
                                    <label for="register-email" style="color: var(--medium-text); font-weight: 600;">Email</label>
                                    <input type="email" class="form-control glass-card" id="register-email" placeholder="Enter your email" style="background: var(--glass-bg); border: 1px solid var(--glass-border); color: var(--light-text);">
                                </div>
                                <div class="form-group">
                                    <label for="register-password" style="color: var(--medium-text); font-weight: 600;">Password</label>
                                    <input type="password" class="form-control glass-card" id="register-password" placeholder="Choose a password" style="background: var(--glass-bg); border: 1px solid var(--glass-border); color: var(--light-text);">
                                </div>
                                <div class="form-group">
                                    <label for="register-confirm-password" style="color: var(--medium-text); font-weight: 600;">Confirm Password</label>
                                    <input type="password" class="form-control glass-card" id="register-confirm-password" placeholder="Confirm your password" style="background: var(--glass-bg); border: 1px solid var(--glass-border); color: var(--light-text);">
                                </div>
                                <button id="register-btn" class="btn btn-primary btn-block glass-card" style="background: linear-gradient(135deg, var(--sea-blue) 0%, var(--sea-green) 50%, var(--light-pink) 100%); border: none; color: var(--light-text); font-weight: 600;">Register</button>
                                <p class="text-center mt-3">
                                    <a href="#" onclick="toggleAuthForm()" id="toggle-auth-form-link">Already have an account? Login</a>
                                </p>
                            </div>
                            <div id="auth-error" class="alert alert-danger mt-3 glass-card" style="display: none; background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.2); color: #fca5a5;"></div>
                            <div id="auth-success" class="alert alert-success mt-3 glass-card" style="display: none; background: rgba(34, 197, 94, 0.1); border: 1px solid rgba(34, 197, 94, 0.2); color: #86efac;"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
